<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سوق الكمبيوترات</title>
    <script>
      // Apply the saved theme before the first paint so a refresh doesn't flash dark (next-themes only runs after React mounts).
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("al-saif-theme") === "light" ? "light" : "dark";
        } catch (error) {}
        document.documentElement.classList.add(theme);
      })();
    </script>
    <meta name="description" content="سوق الكمبيوترات — جوالات، بلايستيشن، وإكسسواراتها." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
