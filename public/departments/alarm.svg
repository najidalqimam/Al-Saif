<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 30 520 500" width="624" height="600">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d424a"/>
      <stop offset="0.5" stop-color="#22252a"/>
      <stop offset="1" stop-color="#111316"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#1c1f24"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffd0d0"/>
      <stop offset="0.25" stop-color="#ff5a5a"/>
      <stop offset="0.7" stop-color="#d11b2a"/>
      <stop offset="1" stop-color="#7f0d17"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5a6270"/>
      <stop offset="0.5" stop-color="#1b1e23"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.4" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="300" cy="500" rx="210" ry="22" fill="url(#shadow)"/>

  <!-- siren: glow, dome, body -->
  <circle cx="330" cy="160" r="140" fill="url(#glow)"/>
  <rect x="222" y="196" width="230" height="290" rx="40" fill="url(#edge)"/>
  <rect x="210" y="190" width="230" height="290" rx="40" fill="url(#body)"/>
  <rect x="210" y="190" width="230" height="290" rx="40" fill="url(#sheen)"/>
  <rect x="211" y="191" width="228" height="288" rx="39" fill="none" stroke="#5b616b" stroke-width="1.4" opacity="0.7"/>
  <path d="M240 200 Q325 70 410 200 Z" fill="url(#dome)"/>
  <path d="M268 182 Q288 150 316 141" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <rect x="232" y="192" width="186" height="14" rx="7" fill="#15171a"/>
  <!-- speaker grille -->
  <g fill="#0b0c0e">
    <rect x="246" y="250" width="158" height="9" rx="4.5"/>
    <rect x="246" y="272" width="158" height="9" rx="4.5"/>
    <rect x="246" y="294" width="158" height="9" rx="4.5"/>
    <rect x="246" y="316" width="158" height="9" rx="4.5"/>
    <rect x="246" y="338" width="158" height="9" rx="4.5"/>
    <rect x="246" y="360" width="158" height="9" rx="4.5"/>
  </g>
  <g fill="#ffffff" opacity="0.05">
    <rect x="246" y="259" width="158" height="2"/><rect x="246" y="281" width="158" height="2"/><rect x="246" y="303" width="158" height="2"/>
    <rect x="246" y="325" width="158" height="2"/><rect x="246" y="347" width="158" height="2"/><rect x="246" y="369" width="158" height="2"/>
  </g>
  <circle cx="325" cy="428" r="12" fill="url(#ledB)"/>
  <circle cx="325" cy="428" r="3.2" fill="#e6f0ff"/>

  <!-- motion sensor in front -->
  <g>
    <rect x="96" y="318" width="132" height="172" rx="30" fill="url(#edge)"/>
    <rect x="88" y="314" width="132" height="172" rx="30" fill="url(#body)"/>
    <rect x="89" y="315" width="130" height="170" rx="29" fill="none" stroke="#5b616b" stroke-width="1.3" opacity="0.7"/>
    <ellipse cx="154" cy="380" rx="44" ry="40" fill="url(#lens)" stroke="#2c3036" stroke-width="2"/>
    <g stroke="#fff" stroke-opacity="0.08" stroke-width="2" fill="none">
      <path d="M118 370 Q154 352 190 370"/><path d="M114 384 Q154 366 194 384"/><path d="M118 398 Q154 380 190 398"/>
    </g>
    <path d="M130 360 Q146 348 166 350" stroke="#fff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="154" cy="448" r="4" fill="#ef4444"/>
  </g>
</svg>
