<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 40 486 480" width="607" height="600">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="0.5" stop-color="#202328"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0e10"/>
      <stop offset="1" stop-color="#1d2025"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3a55"/>
      <stop offset="0.5" stop-color="#0f1726"/>
      <stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34383f"/>
      <stop offset="1" stop-color="#1a1d21"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ebf2"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d98a"/>
      <stop offset="1" stop-color="#c79a3a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8ffd9"/>
      <stop offset="0.35" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1220" flood-opacity="0.22"/>
    </filter>
  </defs>

  <ellipse cx="270" cy="488" rx="170" ry="22" fill="url(#shadow)"/>

  <!-- reader: side depth then face -->
  <rect x="190" y="64" width="190" height="414" rx="34" fill="url(#edge)"/>
  <rect x="180" y="60" width="190" height="414" rx="34" fill="url(#body)"/>
  <rect x="180" y="60" width="190" height="414" rx="34" fill="url(#sheen)"/>
  <rect x="181" y="61" width="188" height="412" rx="33" fill="none" stroke="#5b616b" stroke-width="1.4" opacity="0.7"/>

  <!-- glass top with contactless mark -->
  <rect x="202" y="84" width="146" height="112" rx="18" fill="url(#glass)"/>
  <path d="M206 92 L300 92 L232 192 L210 192 Z" fill="#fff" opacity="0.06"/>
  <g fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round">
    <path d="M262 124 a18 18 0 0 1 0 36"/>
    <path d="M274 114 a30 30 0 0 1 0 56" opacity="0.8"/>
    <path d="M286 104 a44 44 0 0 1 0 76" opacity="0.55"/>
  </g>
  <rect x="236" y="130" width="16" height="24" rx="3" fill="#60a5fa"/>

  <!-- status led -->
  <circle cx="275" cy="216" r="12" fill="url(#led)"/>
  <circle cx="275" cy="216" r="3.2" fill="#e3ffec"/>

  <!-- keypad 3x4 -->
  <g>
    <g id="row">
      <rect x="206" y="238" width="40" height="40" rx="10" fill="url(#key)" stroke="#474c55" stroke-width="1"/>
      <rect x="255" y="238" width="40" height="40" rx="10" fill="url(#key)" stroke="#474c55" stroke-width="1"/>
      <rect x="304" y="238" width="40" height="40" rx="10" fill="url(#key)" stroke="#474c55" stroke-width="1"/>
    </g>
    <use href="#row" y="52"/>
    <use href="#row" y="104"/>
    <use href="#row" y="156"/>
  </g>
  <g fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
    <text x="226" y="264">1</text><text x="275" y="264">2</text><text x="324" y="264">3</text>
    <text x="226" y="316">4</text><text x="275" y="316">5</text><text x="324" y="316">6</text>
    <text x="226" y="368">7</text><text x="275" y="368">8</text><text x="324" y="368">9</text>
    <text x="226" y="420">*</text><text x="275" y="420">0</text><text x="324" y="420">#</text>
  </g>

  <!-- access card leaning in front -->
  <g transform="translate(-36 44) rotate(-12 150 400)" filter="url(#soft)">
    <rect x="78" y="330" width="150" height="96" rx="10" fill="url(#card)" stroke="#d3dbe6" stroke-width="1"/>
    <rect x="78" y="398" width="150" height="16" fill="url(#stripe)"/>
    <rect x="94" y="350" width="28" height="22" rx="4" fill="url(#chip)"/>
    <path d="M94 361 h28 M108 350 v22" stroke="#a8812e" stroke-width="1"/>
    <rect x="134" y="352" width="76" height="6" rx="3" fill="#cfd8e3"/>
    <rect x="134" y="364" width="52" height="6" rx="3" fill="#dde4ed"/>
  </g>
</svg>
