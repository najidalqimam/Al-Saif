<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 190 460 250" width="736" height="400">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="0.55" stop-color="#2b2f35"/>
      <stop offset="1" stop-color="#1c1f24"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#111316"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#0c0d0f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9ffd0"/>
      <stop offset="0.4" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.4" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="290" cy="405" rx="230" ry="34" fill="url(#shadow)"/>

  <!-- feet -->
  <path d="M98 358 l0 9 l20 2 l0 -9z M378 389 l0 9 l20 2 l0 -9z" fill="#08090b"/>

  <!-- body -->
  <path d="M78 286 L404 318 L486 254 L170 228 Z" fill="url(#top)"/>
  <path d="M78 286 L404 318 L486 254 L170 228 Z" fill="url(#sheen)"/>
  <path d="M404 318 L486 254 L486 318 L404 392 Z" fill="url(#side)"/>
  <path d="M78 286 L404 318 L404 392 L78 360 Z" fill="url(#front)"/>
  <!-- edges -->
  <path d="M78 286 L404 318 L486 254" fill="none" stroke="#6b717b" stroke-width="1.6" stroke-linejoin="round" opacity="0.8"/>
  <path d="M404 318 L404 392" stroke="#3a3e45" stroke-width="1.2"/>

  <!-- top vents -->
  <g stroke="#15171a" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <path d="M300 262 L380 270"/><path d="M308 256 L388 264"/><path d="M316 250 L396 258"/><path d="M324 244 L404 252"/>
  </g>

  <!-- front panel -->
  <path d="M96 300 L388 329 L388 378 L96 349 Z" fill="#0d0f12" stroke="#2f333a" stroke-width="1"/>
  <!-- drive bay -->
  <path d="M224 314 L376 329 L376 362 L224 347 Z" fill="#16191d" stroke="#30343b" stroke-width="1"/>
  <g stroke="#262a30" stroke-width="2">
    <path d="M232 323 L368 337"/><path d="M232 331 L368 345"/><path d="M232 339 L368 353"/>
  </g>
  <!-- status leds -->
  <circle cx="118" cy="320" r="9" fill="url(#ledG)"/>
  <circle cx="118" cy="320" r="2.6" fill="#d9ffe6"/>
  <circle cx="142" cy="322.5" r="9" fill="url(#ledB)"/>
  <circle cx="142" cy="322.5" r="2.6" fill="#e6f0ff"/>
  <circle cx="166" cy="325" r="2.6" fill="#3a3f47"/>
  <circle cx="190" cy="327.5" r="2.6" fill="#3a3f47"/>
  <!-- usb ports -->
  <path d="M116 340 l20 2 l0 7 l-20 -2z M146 343 l20 2 l0 7 l-20 -2z" fill="#050607" stroke="#3c4048" stroke-width="1"/>
  <!-- power button -->
  <circle cx="200" cy="345" r="6" fill="#1b1e22" stroke="#4a4f57" stroke-width="1.4"/>
</svg>
