<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 40 520 460" width="678" height="600">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d424a"/>
      <stop offset="0.5" stop-color="#22252a"/>
      <stop offset="1" stop-color="#111316"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#1c1f24"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2b42"/>
      <stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <radialGradient id="bulbGlass" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#fff4d2"/>
      <stop offset="1" stop-color="#f0cd78"/>
    </radialGradient>
    <radialGradient id="bulbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa2ad"/>
      <stop offset="0.45" stop-color="#e3e7ec"/>
      <stop offset="1" stop-color="#7d8692"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.4" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="280" cy="470" rx="230" ry="22" fill="url(#shadow)"/>

  <!-- smart wall switch, back right -->
  <rect x="306" y="150" width="200" height="290" rx="28" fill="url(#edge)" transform="translate(10 6)"/>
  <rect x="306" y="150" width="200" height="290" rx="28" fill="url(#body)"/>
  <rect x="307" y="151" width="198" height="288" rx="27" fill="none" stroke="#5b616b" stroke-width="1.4" opacity="0.7"/>
  <rect x="324" y="168" width="164" height="254" rx="16" fill="url(#glass)"/>
  <path d="M328 172 L400 172 L350 418 L328 418 Z" fill="#fff" opacity="0.05"/>
  <line x1="406" y1="186" x2="406" y2="404" stroke="#2a3a55" stroke-width="2"/>
  <!-- left button: on (warm), right button: off -->
  <circle cx="365" cy="295" r="26" fill="none" stroke="#ffd76a" stroke-width="4"/>
  <path d="M365 280 v14 M355 286 a15 15 0 1 0 20 0" fill="none" stroke="#ffd76a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="447" cy="295" r="26" fill="none" stroke="#475569" stroke-width="4"/>
  <path d="M447 280 v14 M437 286 a15 15 0 1 0 20 0" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="365" cy="390" r="9" fill="url(#ledB)"/><circle cx="365" cy="390" r="2.8" fill="#e6f0ff"/>

  <!-- glowing smart bulb, front left -->
  <circle cx="200" cy="230" r="170" fill="url(#bulbGlow)"/>
  <path d="M200 92 C 266 92 302 142 302 194 C 302 238 274 262 260 292 L 140 292 C 126 262 98 238 98 194 C 98 142 134 92 200 92 Z" fill="url(#bulbGlass)" stroke="#e2b955" stroke-width="2"/>
  <path d="M140 160 C 148 132 170 116 196 112" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" opacity="0.95"/>
  <!-- wifi mark inside bulb -->
  <path d="M176 210 a34 34 0 0 1 48 0 M186 224 a18 18 0 0 1 28 0" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="238" r="5" fill="#2563eb"/>
  <rect x="134" y="290" width="132" height="22" rx="7" fill="#f1f3f6" stroke="#b8c0cb"/>
  <path d="M140 312 h120 v20 h-120z M146 332 h108 v18 h-108z M152 350 h96 v18 h-96z" fill="url(#base)" stroke="#6b737e" stroke-width="1"/>
  <path d="M168 368 h64 l-12 26 h-40z" fill="#2b2f35"/>
</svg>
