<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 60 520 440" width="709" height="600">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d424a"/>
      <stop offset="0.5" stop-color="#22252a"/>
      <stop offset="1" stop-color="#111316"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#1c1f24"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="puck" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#454a53"/>
      <stop offset="0.6" stop-color="#1f2227"/>
      <stop offset="1" stop-color="#0e1013"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2b42"/>
      <stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5a6270"/>
      <stop offset="0.5" stop-color="#1b1e23"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.4" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="280" cy="470" rx="240" ry="22" fill="url(#shadow)"/>

  <!-- door contact sensor (two parts) at the back left -->
  <rect x="70" y="120" width="70" height="300" rx="20" fill="url(#edge)" transform="translate(8 4)"/>
  <rect x="70" y="120" width="70" height="300" rx="20" fill="url(#body)"/>
  <rect x="70" y="120" width="70" height="300" rx="20" fill="url(#sheen)"/>
  <rect x="71" y="121" width="68" height="298" rx="19" fill="none" stroke="#5b616b" stroke-width="1.3" opacity="0.7"/>
  <circle cx="105" cy="160" r="10" fill="url(#ledB)"/>
  <circle cx="105" cy="160" r="2.8" fill="#e6f0ff"/>
  <rect x="150" y="190" width="34" height="160" rx="12" fill="url(#edge)" transform="translate(6 3)"/>
  <rect x="150" y="190" width="34" height="160" rx="12" fill="url(#body)"/>
  <rect x="151" y="191" width="32" height="158" rx="11" fill="none" stroke="#5b616b" stroke-width="1.2" opacity="0.7"/>

  <!-- round temperature sensor with display, centre -->
  <circle cx="318" cy="292" r="118" fill="#0b0c0e" transform="translate(8 8)"/>
  <circle cx="318" cy="292" r="118" fill="url(#puck)"/>
  <circle cx="318" cy="292" r="117" fill="none" stroke="#5b616b" stroke-width="1.4" opacity="0.7"/>
  <circle cx="318" cy="292" r="96" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.55"/>
  <rect x="254" y="244" width="128" height="88" rx="16" fill="url(#screen)"/>
  <text x="318" y="306" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="600" text-anchor="middle">24°</text>
  <g fill="#60a5fa">
    <rect x="296" y="316" width="44" height="4" rx="2" opacity="0.8"/>
  </g>
  <path d="M300 352 a24 24 0 0 1 36 0" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <path d="M308 362 a12 12 0 0 1 20 0" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="318" cy="370" r="3.5" fill="#60a5fa"/>

  <!-- small motion sensor in front right -->
  <rect x="404" y="310" width="104" height="146" rx="26" fill="url(#edge)" transform="translate(7 4)"/>
  <rect x="404" y="310" width="104" height="146" rx="26" fill="url(#body)"/>
  <rect x="405" y="311" width="102" height="144" rx="25" fill="none" stroke="#5b616b" stroke-width="1.2" opacity="0.7"/>
  <ellipse cx="456" cy="368" rx="34" ry="31" fill="url(#lens)" stroke="#2c3036" stroke-width="2"/>
  <path d="M436 352 Q450 342 466 344" stroke="#fff" stroke-opacity="0.35" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="456" cy="424" r="3.5" fill="#3b82f6"/>
</svg>
